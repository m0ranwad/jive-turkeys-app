name: Supabase functions

# Puts the chat notification sender (supabase/functions/notify-chat) on
# Supabase when it changes on main, creating its signing keys the first time.
# On pull requests it only checks that the SUPABASE_ACCESS_TOKEN secret can see
# the project's functions and secrets; nothing is changed until publish.
#
# The token comes from Supabase (Account preferences -> Access Tokens), limited
# to the jive-turkeys project with Project Settings: read, Edge Functions:
# read-write, Edge Function Secrets: read-write.

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml', 'scripts/vapid-keys.mjs', '.github/workflows/functions.yml']
  pull_request:
    paths: ['supabase/functions/**', 'supabase/config.toml', 'scripts/vapid-keys.mjs', '.github/workflows/functions.yml']
  workflow_dispatch:

env:
  PROJECT_REF: alsskultsdgcbxlukznv
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  check:
    name: Supabase access check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: The access token can see the project's functions and secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (see the comment at the top of this file)."
            exit 1
          fi
          supabase functions list --project-ref "$PROJECT_REF"
          # Names only; Supabase never shows secret values.
          supabase secrets list --project-ref "$PROJECT_REF" | awk 'NR > 2 { print $1 }'
          echo "::notice title=Supabase access::The token can see the project's functions and secrets."

  deploy:
    name: Deploy notify-chat
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: supabase-functions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create the notification keys (first time only)
        run: |
          # New keys would cut off every phone already signed up, so stop if the list can't be read.
          existing=$(supabase secrets list --project-ref "$PROJECT_REF")
          if grep -q VAPID_PRIVATE_KEY <<< "$existing"; then
            echo "Notification keys already set."
          else
            keys="$RUNNER_TEMP/vapid.env"
            node scripts/vapid-keys.mjs "$keys"
            supabase secrets set --env-file "$keys" --project-ref "$PROJECT_REF"
            rm -f "$keys"
          fi
      - name: Deploy the notification sender
        run: supabase functions deploy notify-chat --project-ref "$PROJECT_REF" --use-api
