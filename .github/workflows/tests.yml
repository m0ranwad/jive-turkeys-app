name: Tests

# Runs on every pull request, so a broken chat (or a database change that would
# lose team data) shows up as a red check at the preview stage, before anything
# is published. Also runs on main. What's covered: docs/chat.md.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    name: Browser tests (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Screenshots and traces of failures (sample data only).
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  database:
    name: Database rules and rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make sure psql is installed
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Database rules (who can do what, what deleting removes)
        run: bash scripts/test-db.sh
      - name: Rehearse new database changes on a copy with sample data
        run: bash scripts/db-rehearsal.sh "$BASE"
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
